# Validate, test and publish a PHP Composer package to Packagist.
# Packagist builds versions from git tags (composer.json must NOT contain a "version" key).
# This workflow validates the package and the tag, runs the tests and tells Packagist to re-crawl the repository.
# Secrets: PACKAGIST_USERNAME and PACKAGIST_API_TOKEN. Without them the notification is skipped
# (fine when the GitHub webhook / Packagist GitHub App already updates the package).
name: Publish PHP Package (Packagist)

on:
  workflow_call:
    inputs:
      php_version:
        description: "PHP version"
        type: string
        default: "8.3"
      php_extensions:
        description: "Comma separated PHP extensions for setup-php"
        type: string
        default: ""
      working_directory:
        description: "Directory containing composer.json"
        type: string
        default: "."
      install_args:
        description: "Arguments for `composer install`"
        type: string
        default: "--prefer-dist --no-progress --no-interaction"
      run_validate:
        description: "Run `composer validate --strict`"
        type: boolean
        default: true
      run_tests:
        description: "Run the tests"
        type: boolean
        default: true
      test_command:
        description: "Test command. Empty = `composer test` if defined, else vendor/bin/pest, else vendor/bin/phpunit"
        type: string
        default: ""
      package_url:
        description: "Repository URL registered on Packagist (empty = this repository on GitHub)"
        type: string
        default: ""
      verify_tag:
        description: "On tag pushes, fail unless the tag is a semantic version (tag_prefix + MAJOR.MINOR.PATCH[-pre])"
        type: boolean
        default: true
      tag_prefix:
        description: "Optional tag prefix, e.g. v"
        type: string
        default: "v"
      dry_run:
        description: "Validate and test only; do not notify Packagist"
        type: boolean
        default: false
      inform_new_version:
        description: "Mention newer releases of these workflows in the job summary: none | major-only | major-minor-only | all"
        type: string
        default: "all"
    secrets:
      PACKAGIST_USERNAME:
        description: "Packagist username"
        required: false
      PACKAGIST_API_TOKEN:
        description: "Packagist API token (packagist.org -> Profile -> Show API Token)"
        required: false
    outputs:
      version:
        description: "Version taken from the tag (empty when not run on a tag)"
        value: ${{ jobs.publish.outputs.version }}
      published:
        description: "'true' when Packagist accepted the update request"
        value: ${{ jobs.publish.outputs.published }}

jobs:
  publish:
    name: Publish to Packagist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      published: ${{ steps.result.outputs.published }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          coverage: none
          tools: composer:v2

      - name: Validate tag
        id: meta
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          VERIFY_TAG: ${{ inputs.verify_tag }}
        run: |
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
            SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
            if [ "$VERIFY_TAG" = "true" ] && ! [[ "$VERSION" =~ $SEMVER_RE ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version (expected '${TAG_PREFIX}1.2.3')"
              exit 1
            fi
            echo "📦 version $VERSION"
          else
            echo "::notice::Not running on a tag - Packagist will be asked to re-crawl, but no version is derived"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate composer.json
        if: ${{ inputs.run_validate }}
        run: composer validate --strict

      - name: Install dependencies
        env:
          INSTALL_ARGS: ${{ inputs.install_args }}
        run: |
          read -ra EXTRA <<< "$INSTALL_ARGS"
          composer install "${EXTRA[@]}"

      - name: Test
        if: ${{ inputs.run_tests }}
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          if [ -n "$TEST_COMMAND" ]; then
            bash -c "$TEST_COMMAND"
          elif composer run-script --list --no-ansi 2>/dev/null | grep -qE '^\s+test(\s|$)'; then
            composer test
          elif [ -x vendor/bin/pest ]; then
            vendor/bin/pest
          elif [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "::notice::No test command found - skipping tests"
          fi

      - name: Notify Packagist
        id: publish
        if: ${{ !inputs.dry_run }}
        uses: KMM-ZONE/open-flows/actions/packagist-notify@v1.1.0
        with:
          username: ${{ secrets.PACKAGIST_USERNAME }}
          token: ${{ secrets.PACKAGIST_API_TOKEN }}
          package-url: ${{ inputs.package_url }}

      - name: Set result
        id: result
        if: ${{ always() }}
        uses: KMM-ZONE/open-flows/actions/set-published@v1.1.0
        with:
          outcomes: ${{ steps.publish.outputs.notified == 'true' && 'success' || 'skipped' }}

      - name: New version notice
        if: ${{ always() }}
        continue-on-error: true
        uses: KMM-ZONE/open-flows/actions/new-version-notice@v1.1.0
        with:
          level: ${{ inputs.inform_new_version }}
