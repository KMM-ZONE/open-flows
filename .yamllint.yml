# yamllint configuration for GitHub Actions workflows and composite actions
extends: default

rules:
  # run: blocks contain shell scripts and long ${{ }} expressions
  line-length: disable
  # GitHub Actions files do not start with ---
  document-start: disable
  # `on:` is a normal key in workflows, not a boolean
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 2
  # a missing final newline is cosmetic and must never fail a build (editors add it via .editorconfig)
  new-line-at-end-of-file: disable
